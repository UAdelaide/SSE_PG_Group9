<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="/Login/signup.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <!-- jQuery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- Latest compiled JavaScript -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
   <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>
  <script>
    // Load the header content using jQuery AJAX
    $(document).ready(function() {
        $("#header").load("/Login/header.html");
        $("#footer").load("/Login/footer.html");
    });
</script>
</head>

<body>
  <div id="header"></div>
  <!--#include virtual="guestheader.html" -->
  <div>
  <form class="form-signin" id="login1" action="/user/login" method="POST">

    <h3 class="heading mb-3 font-weight-normal "><b>Log in to your account</b></h3>
    <p class="details">Welcome back! Please enter your details.</p>

    <label for="inputEmail" class="login-label">Email <span class="mandatory">*</span></label>
      <input type="email" name="username" id="username" class="form-control" placeholder="Email address" required
        autofocus autocomplete="username">
      <br>

        <label for="inputPassword" class="login-label">Password <span class="mandatory">*</span></label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>


    <div class="checkbox mb-3">
      <label class="login-label">
        <input type="checkbox" value=""> Remember me
      </label>
    </div>
    <button class="btn1 btn-primary btn-block" type="submit" >Log In</button>

    <hr class="line">
    <div class="div-button">
      <button class="btn-block btn1 btn-outline-blue gficon " type="button" onclick="openAuthWindow('/auth/google', 'Login with Google', 500, 600);"><i class="fa fa-google"></i>Login with Google</button>


    </div>
    <p></p>
    <p class="login-color">Don't have an account? <span><a href="../user/signup" class="login-link">Sign Up</a></span></p>


  </form>

</div>
<div>
  <a href="/" class="login-link"> #8592 Return to Home page</a>
</div>
<br><br>
  <footer id="footer"></footer>

  <script>
    // JavaScript function to handle sign-in process

    $(document).ready(function() {
      $('#login1').submit(function(event) {
        event.preventDefault(); // Prevent the default form submission

        const form = $(this);
        const formData = form.serialize();

        $.ajax({
          type: 'POST',
          url: form.attr('action'),
          data: formData,
          dataType: 'json',
          success: function(data) {
            if (data.success) {
              console.log(data);
              sessionStorage.setItem("ID",data.volunteer_id);
              sessionStorage.setItem("User","Volunteer");
              window.location.href = '/user/dashboard';
            } else {
              alert(data.errorMessage);
            }
          },
          error: function() {
            alert("An error occurred. Please try again later.");
          }
        });
      });
    });

    //Google OAuth
    function receiveMessage(event) {
      if (event.data.type === 'success') {
        const user = event.data.user;
        console.log('User:', user);

        fetch('/volunteerLoginGOAuth', {
            method: 'POST',
            headers: {
            'Content-Type': 'application/json'
            },
            body: JSON.stringify({ user })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {

            sessionStorage.setItem("ID",data.volunteer_id);
            sessionStorage.setItem("User","Volunteer");
            window.location.href = '/user/dashboard';
            } else if(data.check){
            alert('Warning: ' + data.message);
            window.location.href = '/user/signup';
            } else {
            alert('Error: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
      }
    }

    window.addEventListener('message', receiveMessage, false);

    function openAuthWindow(url, title, w, h) {
      const left = (screen.width / 2) - (w / 2);
      const top = (screen.height / 2) - (h / 2);
      return window.open(url, title, `width=${w},height=${h},top=${top},left=${left},location=0,status=1`);
    }

  </script>
</body>

</html>
