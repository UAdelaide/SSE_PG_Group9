<!DOCTYPE html>
<html lang="en">

<head>
   <link rel="stylesheet" href="/Login/signup.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <!-- jQuery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- Latest compiled JavaScript -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
   <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>
</head>

<body>
  <div id="header"></div>
  <!--#include virtual="guestheader.html" -->
  <div>

    <form class="form-signin" action="/admin/login" method="POST" id="login1">
      <div class="div-button">
        <button class="btn-block btn1 btn-outline-blue "  onclick="volunteerlogin()" type="button">Log In as Volunteer</button>
        <button class="btn-block btn1 btn-outline-blue " onclick="managerlogin()" type="button">Log In as Manager</button>
      </div>

      <p class="heading mb-3 font-weight-normal "><b>Log in to your Admin account</b></p>
      <p class="details">Welcome back! Please enter your details.</p>

      <label for="inputEmail" class="login-label">Email <span class="mandatory">*</span></label>
      <input type="email" name="username" id="username" class="form-control" placeholder="Email address" required
        autofocus autocomplete="username">
      <br>

        <label for="inputPassword" class="login-label">Password <span class="mandatory">*</span></label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>


      <div class="checkbox mb-3">
        <label class="login-label">
          <!-- <input type="checkbox" value=""> Remember me -->
        </label>
      </div>
      <button class="btn1 btn-primary btn-block" type="submit" >Log In</button>

      <hr class="line">
      <div class="div-button">
        <!--<button class="btn-block btn1 btn-outline-blue gficon " type="button"><i class="fa fa-google"></i>Login with
          Google</button>-->



      </div>



    </form>

  </div>
  <div>
    <a href="/" class="login-link"> &#8592 Return to Home page</a>
  </div>
  <footer class="footer"></footer>

  <script>

$(document).ready(function() {
      $('#login1').submit(function(event) {
        event.preventDefault(); // Prevent the default form submission

        const form = $(this);
        const formData = form.serialize();

        $.ajax({
          type: 'POST',
          url: form.attr('action'),
          data: formData,
          dataType: 'json',
          success: function(data) {
            if (data.success) {

              //Getting ID from response of server in Login.js
              //Storing it in sesssion
              //We can use this later
              sessionStorage.setItem("ID",data.admin_id);
              sessionStorage.setItem("User","Admin");
              window.location.href = '/admin/dashboard';

            } else {
              alert(data.errorMessage);
            }
          },
          error: function() {
            alert("An error occurred. Please try again later.");
          }
        });
      });
    });

    function volunteerlogin(){
      window.location.href = "/user/login";
    }
    function managerlogin(){
      window.location.href = "/manager/login";
    }

  </script>
</body>

</html>
