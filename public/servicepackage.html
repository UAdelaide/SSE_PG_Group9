    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Packages</title>

    <style>
        .header {
            font-size: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #FBFAF9;
            padding: 1rem 5%;
        }
        footer {
            bottom: 0;
            left: 0;
            height: 200px;
            width: 100%;
            background-color: #f4f4f4;
            padding: 1rem;
            text-align: center;
            box-shadow: 0px -2px 5px rgba(0, 0, 0, 0.1);
        }
        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        main {
            flex: 1;
        }
        .container {
            margin-top: 20px;
            width: fit-content;
            margin-left: 200px;
            width: 530px;
        }
        .btn-update {
            background-color: #007BFF;
            color: white;
        }

        .selected-dates {
            margin-bottom: 20px;
        }
        .mandatory {
            color: red;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <nav class="header">
        <a href="/"> <img src="/images/image 4.png" alt="logo.png" class="nav-link-img" style="width: 200px; margin-left: 50px;"> </a>
        <div>
            <button type="button" class="btn btn-dark btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div style="margin-bottom: 1rem;"></div>
    <div class="name-header" style="margin-left:200px; font-weight: bold;">On-Demand Service</div>

    <div class="container">
        <div id="successMessage" style="color: green;"></div>

        <form id="packageForm">
            <div class="form-group">
                <label for="type-of-package">Package<span class="mandatory">*</span></label>
                <select id="package" name="package" class="form-control">
                    <option value="Essential Home Maintenance Package">Essential Home Maintenance Package</option>
                    <option value="Move-In/Move-Out Package">Move-In/Move-Out Package</option>
                    <option value="Pet-Friendly Home Package">Pet-Friendly Home Package</option>
                    <option value="Seasonal Home Preparation Package">Seasonal Home Preparation Package</option>
                    <option value="Disinfection and Safety Package">Disinfection and Safety Package</option>
                </select>
            </div>

            <div class="form-group">
                <label for="serviceday">Additional requirements</label><br>
                <input type="checkbox" id="ppe" name="ppe" value="PPE">
                <label for="ppe"> Additional PPE Provision</label><br>
                <input type="checkbox" id="disinfection" name="disinfection" value="Deep Disinfection">
                <label for="disinfection">Deep Disinfection</label><br>
                <input type="checkbox" id="contactless" name="contactless" value="Contactless Cleaning">
                <label for="contactless"> Contactless Cleaning</label><br>
            </div>

            <div class="form-group">
                <label for="serviceday">Safety Preferences</label><br>
                <input type="checkbox" id="distance" name="distance" value="6 Foot Distance">
                <label for="distance"> Request staff maintain a 6-foot distance at all times </label><br>
                <input type="checkbox" id="contactless-entry" name="contactless-entry" value="Contactless Entry">
                <label for="contactless-entry">Allow contactless entry </label><br>
            </div>

            <div class="form-group">
                <label for="serviceday">Preferred Date<span class="mandatory">*</span></label><br>
                <input type="date" class="form-control" id="date">
            </div>

            <div class="form-group">
                <label for="serviceday">Preferred Time<span class="mandatory">*</span></label><br>
                <input type="time" class="form-control" id="time">
            </div>

            <div class="form-group">
                <label for="servicePerson">Preference of Service Person</label><br>
                <input type="radio" id="male" name="servicePerson" value="male">
                <label for="male">Male</label><br>
                <input type="radio" id="female" name="servicePerson" value="female">
                <label for="female">Female</label><br>
                <input type="radio" id="any" name="servicePerson" value="any">
                <label for="any">No Preference</label>
            </div>

            <div class="form-group">
                <label for="address">Address<span class="mandatory">*</span></label>
                <input type="text" class="form-control" id="street" placeholder="Street">
                <input type="text" class="form-control mt-2" id="suburb" placeholder="Suburb">
                <input type="text" class="form-control mt-2" id="state" placeholder="State">
                <input type="text" class="form-control mt-2" id="country" placeholder="Country">
                <input type="text" class="form-control mt-2" id="pin" placeholder="Pin Code">
            </div>

            <div class="form-group">
                <label for="note">Additional Notes</label>
                <textarea id="note" name="note" rows="6" class="form-control" style="resize: both;"></textarea>
            </div>

            <div class="form-group">
                <input type="checkbox" id="symptoms" name="symptoms" value="No Symptoms">
                <label for="symptoms">I confirm I have not experienced COVID symptoms in the last 14 days.</label><br>
                <input type="checkbox" id="consent" name="consent" value="Data Collection Consent Recieved">
                <label for="consent">I agree to the Privacy Policy and consent to my data being used to provide the selected services in a COVID-safe manner.</label><br>
            </div>

            <button type="button" class="btn btn-dark" onclick="submitForm()">Submit</button>
        </form>
    </div>

    <footer class="footer"></footer>
    <!-- Modal for successful submission -->
    <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Submission Successful</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <img images="images" src="images/success image.jpg" alt="green tick image">
                <div class="modal-body">

                    Your service booking request has been submitted successfully!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>

    // function validateForm() {
    //         const requiredFields = ['servicetype', 'preferedCost', 'serviceday', 'street', 'suburb', 'state', 'country', 'pin'];
    //         let allFilled = true;

    //         requiredFields.forEach(field => {

    //             if (!element.value.trim()) {

    //                 allFilled = false;
    //             } else {
    //                 element.classList.remove("is-invalid");
    //             }
    //         });

    //         if (!allFilled) {
    //             alert("Please fill in all required fields.");
    //         }

    //         return allFilled;
    //     }

        function validateForm() {

            const package = document.getElementById('package').value;
            const date = document.getElementById('date').value;
            const street = document.getElementById('street').value;
            const suburb = document.getElementById('suburb').value;
            const state = document.getElementById('state').value;
            const country = document.getElementById('country').value;
            const pin = document.getElementById('pin').value;

            if (!package| !date| !street| !suburb| !state| !country| !pin) {
                alert("Please fill in all required fields.");
                return false;
            }
            return true;
        }

        function submitForm() {
            if (!validateForm()) return;

            const form = document.getElementById("packageForm");
            const package = document.getElementById('package').value;
            const servicePerson = form.elements['servicePerson'].value;
            const date = document.getElementById('date').value;

            const additionalServices = [];
            if (document.getElementById("ppe").checked) {
                additionalServices.push(document.getElementById("ppe").value);
            }
            if (document.getElementById("disinfection").checked) {
                additionalServices.push(document.getElementById("disinfection").value);
            }
            if (document.getElementById("contactless").checked) {
                additionalServices.push(document.getElementById("contactless").value);
            }

            const safetyPreferences = [];
            if (document.getElementById("distance").checked) {
                safetyPreferences.push(document.getElementById("distance").value);
            }
            if (document.getElementById("contactless-entry").checked) {
                safetyPreferences.push(document.getElementById("contactless-entry").value);
            }

            const time = document.getElementById('time').value;
            const street = document.getElementById('street').value;
            const suburb = document.getElementById('suburb').value;
            const state = document.getElementById('state').value;
            const country = document.getElementById('country').value;
            const pin = document.getElementById('pin').value;
            const note = document.getElementById('note').value
            const consent = $('.consent:checked').val();
            const symptoms = $('.symptoms:checked').val();

            const formData = {
                package,
                servicePerson,
                date,
                time,
                additionalServices,
                safetyPreferences,
                street,
                suburb,
                state,
                country,
                pin,
                note,
                consent,
                symptoms
            };

            fetch('/submitPackage', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Form submitted successfully!') {
                    // Show the success modal
                    $('#successModal').modal('show');
                } else {
                    alert('Error submitting form: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error submitting form.');
            });
        }

        function logout() {
            sessionStorage.removeItem('email');
            window.location.href = '/Login.html';
        }
    </script>
</body>
</html>
