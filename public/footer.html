<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Example</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>

      /* Footer */
      .footer {
        background-color: #0A142F;
        color: white;
        padding: 1rem;
        overflow: hidden;
        margin-top: 20px;
      }

      .footer-left {
        float: left;
        width: 50%;
      }

      .footer-right {
        float: right;
        width: 50%;
        text-align: right;
      }

      .footer-logo img {
        width: 10vw;
      }

      .footer-info p {
        margin: 1rem 0;
        font-size: 1em;
      }

      .social-icons a {
        padding: 1vw;
        display: grid;
        margin-right: 1vw;
        text-decoration: none;
        color: white;
        font-size: 1em;
      }

      .social-icons img {
        width: 3vw;
      }

      .copyright {
        clear: both;
        text-align: center;
        margin-top: 2vw;
      }
    </style>
  </head>

<body>
    <footer class="footer">
        <div class="container">
          <div class="row">
            <div class="col-md-6">
              <div class="footer-logo">
                <img src="/images/logo.png" alt="Logo" class="img-fluid" style="max-width: 100px;">
              </div>
              <div class="footer-info">
                <p>123 Main Street, Adelaide North, SA 5005</p>
                <p>Contact: (454)456-1034</p>
                <p>Email: helpinghands@gmail.com</p>
              </div>
            </div>
            <div class="col-md-6 text-md-right">
              <div class="social-icons">
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
                <a href="#">Twitter</a>
                <a href="#">LinkedIn</a>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 text-center">
              <div class="copyright">
                <p>&copy; 2024 Helping Hands. All Rights Reserved.</p>
              </div>
            </div>
          </div>
        </div>
      </footer>

      <!-- Bootstrap JS (optional) -->
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
      <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
