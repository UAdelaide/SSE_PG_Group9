<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Special Service</title>

    <style>
        .header {
            font-size: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #FBFAF9;
            padding: 1rem 5%;
        }
        footer {
            bottom: 0;
            left: 0;
            height: 200px;
            width: 100%;
            background-color: #f4f4f4;
            padding: 1rem;
            text-align: center;
            box-shadow: 0px -2px 5px rgba(0, 0, 0, 0.1);
        }
        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        main {
            flex: 1;
        }
        .container {
            margin-top: 20px;
            width: fit-content;
            margin-left: 200px;
            width: 530px;
        }
        .btn-update {
            background-color: #007BFF;
            color: white;
        }

        .selected-dates {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="header">
        <a href="/home"> <img src="/images/image 4.png" alt="logo.png" class="nav-link-img" style="width: 200px; margin-left: 50px;"> </a>
        <div>
            <button type="button" class="btn btn-dark btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div style="margin-bottom: 1rem;"></div>
    <div class="name-header" style="margin-left:200px; font-weight: bold;">General Special Service</div>

    <div class="container">
        <div id="successMessage" style="color: green;"></div>

        <form id="updateForm">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" class="form-control" id="firstName">
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" class="form-control" id="lastName">
            </div>
            <div class="form-group">
                <label for="email">Email ID</label>
                <input type="email" class="form-control" id="email">
            </div>
            <div class="form-group">
                <label for="contact">Phone Number</label>
                <input type="tel" class="form-control" id="contact">
            </div>
            <div class="form-group">
                <label for="type-of-service">Type of Service</label>
                <select id="servicetype" name="servicetype" class="form-control">
                    <option value="house inspection">House Inspection</option>
                    <option value="painting">Painting</option>
                    <option value="plumbing">Plumbing</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="pest control">Pest Control</option>
                    <option value="electrical">Electrical</option>
                    <option value="carpentry">Carpentry</option>
                    <option value="heatingCooling">Heating & Cooling</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Select Date</label>
                <input type="date" class="form-control" id="date">
            </div>

            <div class="form-group">
                <label for="preferedCost">Preferred Cost of Service</label>
                <input type="number" class="form-control" id="preferedCost">
            </div>
            <div class="form-group">
                <label for="hours">Duration of Service (hours)</label>
                <input type="number" class="form-control" id="hours">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="street" placeholder="Street">
                <input type="text" class="form-control mt-2" id="suburb" placeholder="Suburb">
                <input type="text" class="form-control mt-2" id="state" placeholder="State">
                <input type="text" class="form-control mt-2" id="country" placeholder="Country">
                <input type="text" class="form-control mt-2" id="pin" placeholder="Pin Code">
            </div>
            <div class="form-group">
                <label for="note">Note</label>
                <textarea id="note" name="note" rows="6" class="form-control" style="resize: both;"></textarea>
            </div>

            <div class="form-group">
                <input type="checkbox" id="symptoms" name="symptoms" value="No Symptoms">
                <label for="symptoms">I confirm I have not experienced COVID symptoms in the last 14 days.</label><br>
                <input type="checkbox" id="consent" name="consent" value="Data Collection Consent Recieved" required>
                <label for="consent">I agree to the Privacy Policy and consent to my data being used to provide the selected services in a COVID-safe manner.</label><br>
            </div>

            <button type="button" class="btn btn-dark" onclick="submitForm()">Submit</button>
        </form>
    </div>

    <footer class="footer"></footer>

     <!-- Modal for successful submission -->
    <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Submission Successful</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <img images="images" src="images/success image.jpg" alt="green tick image">
                <div class="modal-body">

                    Your service booking request has been submitted successfully!
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
          $('.footer').load('Login/footer.html');

          function validateForm() {
            const requiredFields = ['firstName', 'lastName', 'email', 'contact', 'servicetype', 'date', 'preferedCost', 'hours'];
            let allFilled = true;

            requiredFields.forEach(field => {
                const element = document.getElementById(field);
                if (!element.value.trim()) {
                    element.classList.add("is-invalid");
                    allFilled = false;
                } else {
                    element.classList.remove("is-invalid");
                }
            });

            if (!allFilled) {
                alert("Please fill in all required fields.");
            }

            return allFilled;
        }

        function submitForm() {
            if (!validateForm()) return;

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                contact: document.getElementById('contact').value,
                servicetype: document.getElementById('servicetype').value,
                date: document.getElementById('date').value,
                preferedCost: document.getElementById('preferedCost').value,
                hours: document.getElementById('hours').value,
                street: document.getElementById('street').value,
                suburb: document.getElementById('suburb').value,
                state: document.getElementById('state').value,
                country: document.getElementById('country').value,
                pin: document.getElementById('pin').value,
                note: document.getElementById('note').value,
                consent: $('.consent:checked').val(),
                symptoms: $('.symptoms:checked').val()
            };

            fetch('/submitForm', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Form submitted successfully!') {
                    // Show the success modal
                    $('#successModal').modal('show');
                } else {
                    alert('Error submitting form: ' + data.message);
                }
            })
            .catch(error => console.error('Error submitting form:', error));
        }


        function logout() {
            sessionStorage.removeItem('email');
            window.location.href = '/logout';
        }
    </script>
</body>
</html>
