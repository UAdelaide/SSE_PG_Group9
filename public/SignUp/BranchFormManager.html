<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- jQuery library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Latest compiled JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

   <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/SignUp/signup.css">
    <title>Document</title>
    <style>
      .form-check-inline {
        display: inline-block;
        margin-right: 10px;
      }
    </style>
  </head>

    <body>
        <form class="form-signin" id="branchFormManager">
            <h2>Additional Information</h2>
            <input type="hidden" id="first_name" name="first_name">
            <input type="hidden" id="last_name" name="last_name">
            <input type="hidden" id="contact" name="conatct">
            <input type="hidden" id="dob" name="dob">
            <input type="hidden" id="gender" name="gender">
            <input type="hidden" id="email" name="email">
            <label class="login-label">Address</label>
            <label for="street" class="login-label">Street <span class="mandatory">*</span></label>
            <input type="text" name="street" id="street" class="form-control" placeholder="Enter Street"
                required>
            <br>
            <label for="suburb" class="login-label">Suburb <span class="mandatory">*</span></label>
            <input type="text" name="suburb" id="suburb" class="form-control" placeholder="Enter Suburb"
                required>
            <br>
            <label for="state" class="login-label">State <span class="mandatory">*</span></label>
            <input type="text" name="state" id="state" class="form-control" placeholder="Enter State" required>
            <br>
            <label for="country" class="login-label">Country <span class="mandatory">*</span></label>
            <select id="country" name="country" class="form-control" required>
                <option value="">Select your country</option>
            </select>
            <br>
            <label for="pincode" class="login-label">Pincode <span class="mandatory">*</span></label>
            <input type="text" name="pin" id="pincode" class="form-control" placeholder="Enter Pincode" required>
            <br>
            <label for="secret_key" class="login-label">Secret-Key <span class="mandatory">*</span></label>
            <input type="text" name="secret_key" id="secret_key" class="form-control" placeholder="Enter the secret key"
                required>
            <br>
            <label for="branch" class="login-label">Branch <span class="mandatory">*</span></label>
            <select id="branch" name="name" class="form-control" required>
                <option value="">Select the branch</option>
            </select>
            <br>
            <button class="btn1 btn-primary btn-block" type="submit">Sign Up</button>
        </form>
        <script>
             // Populate countries in the dropdown
            function populateCountries() {
            const countryDropdown = document.getElementById('country');
            fetch('https://restcountries.com/v3.1/all')
                .then(response => response.json())
                .then(data => {
                data.forEach(country => {
                    const option = document.createElement('option');
                    option.value = country.name.common;
                    option.textContent = country.name.common;
                    countryDropdown.appendChild(option);
                });
                })
                .catch(error => {
                console.error('Error fetching countries:', error);
                });
            }

            document.addEventListener('DOMContentLoaded', populateCountries);

            // Populate branches in the dropdown
            function populateBranches() {
            const branchDropdown = document.getElementById('branch');
            fetch('/branches-for-managers')
                .then(response => response.json())
                .then(data => {
                data.forEach(branch => {
                    const option = document.createElement('option');
                    option.value = branch.branch_id;
                    option.textContent = branch.name;
                    branchDropdown.appendChild(option);
                });
                })
                .catch(error => {
                console.error('Error fetching branches:', error);
                });
            }

            document.addEventListener('DOMContentLoaded', populateBranches);

            document.getElementById('branchFormManager').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                contact: document.getElementById('contact').value,
                dob: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
                email: document.getElementById('email').value,
                street: document.getElementById('street').value,
                suburb: document.getElementById('suburb').value,
                state: document.getElementById('state').value,
                country: document.getElementById('country').value,
                pin: document.getElementById('pincode').value,
                secret_key: document.getElementById('secret_key').value,
                branch_id: document.getElementById('branch').value,
            };

            fetch('/registerManagerGOauth', {
                method: 'POST',
                headers: {
                'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                alert('Manager registered successfully!');
                window.opener.location.href = `/manager/profile?manager_id=${data.manager_id}`;
                window.close();
                } else if(data.check){
                alert('Warning: ' + data.message);
                window.opener.location.href = '/manager/login';
                window.close();
                } else {
                alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });

            function populateForm(user) {
                document.getElementById('first_name').value = user.first_name;
                document.getElementById('last_name').value = user.last_name;
                document.getElementById('contact').value = user.phoneNumber;
                document.getElementById('dob').value = user.dob;
                document.getElementById('gender').value = user.gender;
                document.getElementById('email').value = user.email;
            }
        </script>
    </body>
</html>
