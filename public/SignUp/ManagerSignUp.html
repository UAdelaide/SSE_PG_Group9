<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="/Login/signup.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <!-- jQuery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- Latest compiled JavaScript -->
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
   <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manager Sign Up</title>
</head>

<body>

  <div>
    <form class="form-signin" id="manager-registration-form">
      <div class="div-button">
        <button class="btn-block btn1 btn-outline-blue " onclick="usersignup()" type="button">Sign Up as a
          Volunteer</button>
      </div>

      <h3 class="h4 mb-3 font-weight-normal">Register as a Manager</h3>
      <p>Work with us!</p>

      <label for="inputfirstname" class="login-label">First name <span class="mandatory">*</span></label>
      <input type="text" name="first_name" id="inputfirstname" class="form-control" placeholder="Enter your first name"
        required autofocus>
      <br>

      <label for="inputlastname" class="login-label">Surname <span class="mandatory">*</span></label>
      <input type="text" name="last_name" id="inputlastname" class="form-control" placeholder="Enter your surname name"
        required>
      <br>
      <label for="inputKey" class="login-label">Secret-Key <span class="mandatory">*</span></label>
      <input type="text" name="secret_key" id="inputSecretKey" class="form-control" placeholder="Enter the secret key"
        required>
      <br>
      <label for="inputKey" class="login-label">Contact <span class="mandatory">*</span></label>
      <input type="text" name="contact" id="inputContact" class="form-control" placeholder="Enter your contact number"
        required>
      <br>
      <label for="inputKey" class="login-label">Street <span class="mandatory">*</span></label>
      <input type="text" name="street" id="inputStreet" class="form-control" placeholder="Enter your street address i.e. 10 North Tce"
        required>
      <br>
      <label for="inputKey" class="login-label">Suburb <span class="mandatory">*</span></label>
      <input type="text" name="suburb" id="inputSuburb" class="form-control" placeholder="Enter your suburb i.e. Adelaide"
        required>
      <br>
      <label for="inputKey" class="login-label">State <span class="mandatory">*</span></label>
      <input type="text" name="state" id="inputState" class="form-control" placeholder="Enter your state i.e. SA" required>
      <br>
      <label for="inputCountry" class="login-label">Country <span class="mandatory">*</span></label>
      <select id="inputCountry" name="country" class="form-control" required>
        <option value="">Select your country</option>
      </select>
      <br>
      <label for="inputKey" class="login-label">Pincode <span class="mandatory">*</span></label>
      <input type="text" name="pin" id="inputPincode" class="form-control" placeholder="Enter your zipcode i.e. 5000" required>
      <br>
      <label for="inputbranch" class="login-label">Branch <span class="mandatory">*</span></label>
      <select id="inputbranch" name="name" class="form-control" required>
        <option value="">Select the branch</option>
      </select>

      <br>

      <label for="inputEmail" class="login-label">Email <span class="mandatory">*</span></label>
      <input type="email" name="email" id="inputEmail" class="form-control" placeholder="Enter your email address" required
        autofocus>
      <br>

      <label for="inputPassword" class="login-label">Password <span class="mandatory">*</span></label>
      <input type="password" name="password" id="inputPassword" class="form-control" placeholder="Enter Password" required>
      <br>
      <label for="inputconfirmPassword" class="login-label">Confirm Password <span class="mandatory">*</span></label>
      <input type="password" id="inputconfirmPassword" class="form-control" placeholder="Confirm password" required>

      <!-- Error message element -->
      <div id="error-message" class="text-danger"></div>
      <br>
      <button class="btn1 btn-primary btn-block" type="submit">Sign Up</button>

      <hr>
      <div class="div-button">
        <button class="btn-block btn1 btn-outline-blue gficon " type="button" onclick="openAuthWindow('/auth/google', 'Sign In with Google', 500, 600);"><i class="fa fa-google"></i>Sign Up with
          Google</button>



      </div>
      <p></p>
      <p class="login-color">Already have an account? <span><a href="../manager/login" class="login-link">Login</a></span></p>


    </form>

  </div>
  <div>
    <a href="/" class="login-link"> &#8592 Return to Home page</a>
  </div>


  <script>
    function usersignup() {
      window.location.href = "../user/signup";
    }

    function validatePasswords(event) {
      const password = document.getElementById('inputPassword').value;
      const confirmPassword = document.getElementById('inputconfirmPassword').value;
      const errorMessage = document.getElementById('error-message');

      if (password !== confirmPassword) {
        errorMessage.textContent = "Passwords do not match.";
        event.preventDefault(); // Prevent form submission
        return false;
      }

      errorMessage.textContent = ""; // Clear any previous error message
      return true;

    }


    // Populate countries in the dropdown
    function populateCountries() {
      const countryDropdown = document.getElementById('inputCountry');
      fetch('https://restcountries.com/v3.1/all')
        .then(response => response.json())
        .then(data => {
          console.log('Fetched countries data:', data); // Log fetched data
          data.forEach(country => {
            const option = document.createElement('option');
            option.value = country.name.common;
            option.textContent = country.name.common;
            countryDropdown.appendChild(option);
          });
          console.log('Country dropdown populated');
        })
        .catch(error => {
          console.error('Error fetching countries:', error);
        });
    }

    document.addEventListener('DOMContentLoaded', populateCountries);


    // Store the mapping between branch names, IDs, and secret keys
    let branchMapping = {};
    function populateBranches() {
      const branchDropdown = document.getElementById('inputbranch');
      fetch('/branches-for-managers') // Assuming this endpoint returns the branch details
        .then(response => response.json())
        .then(branchData => {
          console.log('Fetched branch data:', branchData); // Log fetched branch data
          branchData.forEach(branch => {
            const option = document.createElement('option');
            option.value = branch.branch_id; // Set the value of the option to the branch ID
            option.textContent = branch.name; // Set the text content of the option to the branch name
            branchDropdown.appendChild(option); // Append the option to the dropdown

            // Add to branchMapping
            branchMapping[branch.branch_id] = {
              name: branch.name,
              secret_key: branch.secret_key
            };
          });
          console.log('Branch dropdown populated');
        })
        .catch(error => {
          console.error('Error fetching branch data:', error);
        });
    }

    document.addEventListener('DOMContentLoaded', populateBranches);

    $(document).ready(function () {
      $('#manager-registration-form').on('submit', function (event) {
        event.preventDefault();

        if (!validatePasswords()) {
          return;
        }

        const formData = {
          first_name: $('#inputfirstname').val(),
          last_name: $('#inputlastname').val(),
          contact: $('#inputContact').val(),
          street: $('#inputStreet').val(),
          suburb: $('#inputSuburb').val(),
          state: $('#inputState').val(),
          country: $('#inputCountry').val(),
          pin: $('#inputPincode').val(),
          branch_id: $('#inputbranch').val(),
          email: $('#inputEmail').val(),
          password: $('#inputPassword').val(),
          secret_key: $('#inputSecretKey').val(),
        };

        $.ajax({
          url: '/validate-and-add-manager',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(formData),
          success: function (response) {
            alert('Registration successful');
            window.location.href = '/manager/login'; // Redirect on success
          },
          error: function (jqXHR, textStatus, errorThrown) {
            if (jqXHR.status === 400) {
              $('#error-message').text('Invalid secret key.');
            } else {
              $('#error-message').text('An error occurred. Please try again.');
            }
          }
        });
      });
    });

    //Google OAuth
    function receiveMessage(event) {
      if (event.data.type === 'success') {
        const user = event.data.user;
        console.log('User:', user);
        openBranchForm(user);
      }
    }

    window.addEventListener('message', receiveMessage, false);

    function openAuthWindow(url, title, w, h) {
      const left = (screen.width / 2) - (w / 2);
      const top = (screen.height / 2) - (h / 2);
      return window.open(url, title, `width=${w},height=${h},top=${top},left=${left},location=0,status=1`);
    }

    function openBranchForm(user) {
      fetch('/getBranchManager')
        .then(response => response.text())
        .then(formHtml => {
          const formWindow = window.open('', 'Branch Form', 500, 600);
          formWindow.document.write(formHtml);
          formWindow.document.close();
          formWindow.onload = () => {
            formWindow.populateForm(user);
          };
        })
        .catch(error => {
          console.error('Error loading form:', error);
        });
    }


  </script>
</body>

</html>
