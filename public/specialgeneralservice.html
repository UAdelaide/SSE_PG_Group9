<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Special Service</title>

    <style>
        .header {
            font-size: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #FBFAF9;
            padding: 1rem 5%;
        }
        footer {
            bottom: 0;
            left: 0;
            height: 200px;
            width: 100%;
            background-color: #f4f4f4;
            padding: 1rem;
            text-align: center;
            box-shadow: 0px -2px 5px rgba(0, 0, 0, 0.1);
        }
        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        main {
            flex: 1;
        }
        .container {
            margin-top: 20px;
            width: fit-content;
            margin-left: 200px;
            width: 530px;
        }
        .btn-update {
            background-color: #007BFF;
            color: white;
        }

        .selected-dates {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="header">
        <a href="/"> <img src="/images/image 4.png" alt="logo.png" class="nav-link-img" style="width: 200px; margin-left: 50px;"> </a>
        <div>
            <button type="button" class="btn btn-dark btn-sm" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div style="margin-bottom: 1rem;"></div>
    <div class="name-header" style="margin-left:200px; font-weight: bold;">General Special Service</div>

    <div class="container">
        <div id="successMessage" style="color: green;"></div>

        <form id="updateForm">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" class="form-control" id="firstName">
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" class="form-control" id="lastName">
            </div>
            <div class="form-group">
                <label for="email">Email ID</label>
                <input type="email" class="form-control" id="email">
            </div>
            <div class="form-group">
                <label for="contact">Phone Number</label>
                <input type="tel" class="form-control" id="contact">
            </div>
            <div class="form-group">
                <label for="type-of-service">Type of Service</label>
                <select id="servicetype" name="servicetype" class="form-control">
                    <option value="house inspection">House Inspection</option>
                    <option value="painting">Painting</option>
                    <option value="plumbing">Plumbing</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="pest control">Pest Control</option>
                    <option value="electrical">Electrical</option>
                    <option value="carpentry">Carpentry</option>
                    <option value="heatingCooling">Heating & Cooling</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dates[]">Select Date(s)</label>
                <div id="date-container">
                    <input type="date" class="form-control mt-2" name="dates[]" onchange="updateSelectedDates()">
                </div>
                <button type="button" class="btn btn-secondary mt-2" onclick="addDateField()">Add Another Date</button>
            </div>

            <div id="selected-dates-container" class="selected-dates">
                <!-- Selected dates will appear here -->
            </div>
            <div class="form-group">
                <label for="preferedCost">Preferred Cost of Service</label>
                <input type="number" class="form-control" id="preferedCost">
            </div>
            <div class="form-group">
                <label for="hours">Duration of Service (hours)</label>
                <input type="number" class="form-control" id="hours">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="street" placeholder="Street">
                <input type="text" class="form-control mt-2" id="suburb" placeholder="Suburb">
                <input type="text" class="form-control mt-2" id="state" placeholder="State">
                <input type="text" class="form-control mt-2" id="country" placeholder="Country">
                <input type="text" class="form-control mt-2" id="pin" placeholder="Pin Code">
            </div>
            <div class="form-group">
                <label for="note">Note</label>
                <textarea id="note" name="note" rows="6" class="form-control" style="resize: both;"></textarea>
            </div>
            <button type="button" class="btn btn-dark" onclick="submitForm()">Submit</button>
        </form>
    </div>

    <footer class="footer"></footer>

    <script>
        function validateForm() {
    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;
    const email = document.getElementById('email').value;
    const contact = document.getElementById('contact').value;
    const servicetype = document.getElementById('servicetype').value;

    if (!firstName || !lastName || !email || !contact || !servicetype) {
        alert("Please fill in all required fields.");
        return false;
    }
    return true;
}

function submitForm() {
    if (!validateForm()) return;

    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;
    const email = document.getElementById('email').value;
    const contact = document.getElementById('contact').value;
    const servicetype = document.getElementById('servicetype').value;
    const dates = Array.from(document.querySelectorAll("input[name='dates[]']")).map(input => input.value);
    const preferedCost = document.getElementById('preferedCost').value;
    const hours = document.getElementById('hours').value;
    const street = document.getElementById('street').value;
    const suburb = document.getElementById('suburb').value;
    const state = document.getElementById('state').value;
    const country = document.getElementById('country').value;
    const pin = document.getElementById('pin').value;
    const note = document.getElementById('note').value;

    const formData = {
        firstName,
        lastName,
        email,
        contact,
        servicetype,
        dates,
        preferedCost,
        hours,
        street,
        suburb,
        state,
        country,
        pin,
        note
    };

    fetch('/submitForm', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.message === 'Form submitted successfully!') {
            const successMessage = document.getElementById('successMessage');
            successMessage.innerHTML = "Form submitted successfully!";
            setTimeout(() => successMessage.innerHTML = "", 3000);
        } else {
            alert('Error submitting form: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error submitting form.');
    });
}

        function logout() {
            sessionStorage.removeItem('email');
            window.location.href = '/Login.html';
        }

        let dateFieldCount = 1;
        const maxDates = 3; // Limit to 3 date fields

        function addDateField() {
            if (dateFieldCount >= maxDates) {
                alert("You can only add up to 3 dates.");
                return;
            }
            dateFieldCount++;

            const container = document.getElementById("date-container");
            const dateFieldWrapper = document.createElement("div");
            dateFieldWrapper.classList.add("input-group", "mt-2", "date-field");

            const newDateField = document.createElement("input");
            newDateField.type = "date";
            newDateField.classList.add("form-control");
            newDateField.name = "dates[]";
            newDateField.onchange = updateSelectedDates;

            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.classList.add("btn", "btn-danger");
            removeButton.textContent = "Remove";
            removeButton.onclick = function() {
                removeDateField(removeButton);
            };

            const inputGroupAppend = document.createElement("div");
            inputGroupAppend.classList.add("input-group-append");
            inputGroupAppend.appendChild(removeButton);

            dateFieldWrapper.appendChild(newDateField);
            dateFieldWrapper.appendChild(inputGroupAppend);
            container.appendChild(dateFieldWrapper);

            updateSelectedDates();
        }

        function removeDateField(button) {
            const dateFieldWrapper = button.parentElement.parentElement;
            dateFieldWrapper.remove();
            dateFieldCount--;
            updateSelectedDates();
        }

        function updateSelectedDates() {
            const dates = document.querySelectorAll("input[name='dates[]']");
            const selectedDatesContainer = document.getElementById("selected-dates-container");
            selectedDatesContainer.innerHTML = ""; // Clear previous dates

            dates.forEach(dateField => {
                if (dateField.value) {
                    const dateItem = document.createElement("p");
                    dateItem.textContent = `Selected Date: ${dateField.value}`;
                    selectedDatesContainer.appendChild(dateItem);
                }
            });
        }

        window.onload = function() {
            // Initialize the selected dates display
            updateSelectedDates();
        };
    </script>
</body>
</html>
